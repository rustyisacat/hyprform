[project]
name = "hyprform"
version = "1.0.0"
description = "A GUI for editing Hyprland's config — no nano, no lingo"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "pygobject>=3.50",
    "luaparser>=4.1",
]

[project.scripts]
hyprform = "hyprform.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyprform"]

[dependency-groups]
dev = ["pytest>=8.0"]
