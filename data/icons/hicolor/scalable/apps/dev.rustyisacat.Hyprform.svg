<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.15" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="knob-shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- rx/ry directly on the fill shapes, not a clipPath — some icon
       renderers (confirmed: whatever composites the launcher's app grid
       here) don't apply clip-path reliably and fall back to the full
       square, silently losing the rounded corners. -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#sheen)"/>
  <!-- a single bold toggle switch, "on" — reads clearly even at 16px -->
  <rect x="26" y="50" width="76" height="28" rx="14" fill="#ffffff" fill-opacity="0.26"/>
  <circle cx="86" cy="64" r="17" fill="#ffffff" filter="url(#knob-shadow)"/>
</svg>
